name: Rust milestone checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  credential-scan:
    name: Credential scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, Node.js 24
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan full history for credentials
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks" git . --log-opts=--all --redact=100 \
            --exit-code=1 --ignore-gitleaks-allow --no-banner
  native:
    strategy:
      fail-fast: false
      matrix:
        # Keep Intel coverage available when ARM64 runner capacity is low.
        os: [ubuntu-latest, macos-15-intel, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, Node.js 24
        with:
          persist-credentials: false
      - name: Install Rust tooling
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo +stable fmt --all --check
      - name: Lints
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo +stable test --workspace --locked
      - name: Runtime architecture boundary
        run: python scripts/check_architecture.py
      - name: License headers
        run: python scripts/check_headers.py
      - name: Build CLI and runner
        run: cargo +stable build --workspace --locked
      - name: Conformance report (Unix)
        if: runner.os != 'Windows'
        run: target/debug/git-conformance --candidate target/debug/ferragit --report artifacts/conformance.json
      - name: Conformance report (Windows)
        if: runner.os == 'Windows'
        run: target/debug/git-conformance.exe --candidate target/debug/ferragit.exe --report artifacts/conformance.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, Node.js 24
        if: always()
        with:
          name: conformance-${{ matrix.os }}
          path: artifacts/conformance.json
          if-no-files-found: ignore
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, Node.js 24
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 check --workspace --all-targets --locked

